# Starter taxonomy for the inventree-compose catalog tool. Declare every category, field, location
# and model the inventory may use; `.\docker-compose.ps1 catalog sync` applies it and `add` /
# `update` refuse anything not declared here.

[[categories]]
name = "Laptops"
description = "Portable computers."
label = "large"
placement = "Underside next to the model sticker."
part_description = ["{Screen size (in)} in ", "laptop", ", {Brand}"]

[[fields]]
name = "Brand"
type = "TEXT"
categories = ["Laptops"]
required = true

[[fields]]
name = "Screen size (in)"
type = "NUMBER"
categories = ["Laptops"]

[[fields]]
name = "Label placement"
type = "TEXT"
help = "Where the asset label goes. Generated by the catalog tool from the category's placement or the model's own; never set by hand."
categories = ["Laptops"]
generated = true

[[locations]]
name = "Office"

[[models]]
name = "Lenovo ThinkPad T14 Gen 3"
category = "Laptops"
fields = { "Brand" = "Lenovo", "Screen size (in)" = 14 }
